spring.application.name=bms

# A refusal that reaches this line is a bug: the domain answers its own
# refusals with a status and a sentence (see ApiExceptionHandler), so an
# unhandled exception means a hole in that coverage. The default body is the
# bare {"timestamp","status","error","path"} shape, which cannot say which
# subsystem failed — a 500 from a repository, from validation and from the
# security layer are indistinguishable. This adds the exception's type and
# message (never its stack trace, which stays out of an API response).
server.error.include-message=always
server.error.include-binding-errors=always

# Health reports each component (db, ...) so callers can see *what* is down.
management.endpoint.health.show-components=always

# Local dev defaults: the compose Postgres (slice 3).
# Integration tests override these via Testcontainers @ServiceConnection.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/bms}
spring.datasource.username=${DB_USER:bms}
spring.datasource.password=${DB_PASSWORD:bms}

# Local dev port: 8081, not Spring's 8080 — 8080 is a magnet for unrelated
# system agents (one dev box had a backup service squatting it, silently
# accepting connections and never answering HTTP). SERVER_PORT overrides;
# the e2e harness sets it to 8082 (web/e2e/support/api-base.ts).
server.port=${SERVER_PORT:8081}

# Auth (ADR 0015): HS256 shared secret for the ~12h login cookie.
# Dev default only — any shared environment must override it (AUTH_JWT_SECRET).
auth.jwt.secret=${AUTH_JWT_SECRET:3eced932e8977c5e1cbed61de5858d158506ca8e36f9483f5bf3c6ded4d0b92e}
